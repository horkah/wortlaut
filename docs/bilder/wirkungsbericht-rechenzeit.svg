<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 480" width="780" height="480" role="img" aria-label="Nutzen gegen Rechenzeit">
<style>
svg{--surface:#fcfcfb;--t1:#0b0b0b;--t2:#52514e;--t3:#8a8984;--grid:#e6e5e0;--a:#2a78d6;--b:#eb6834;--rausch:#8a8984;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--t1:#ffffff;--t2:#c3c2b7;--t3:#8f8e87;--grid:#3a3a37;--a:#3987e5;--b:#d95926;--rausch:#8f8e87}}
.bg{fill:var(--surface)} .t1{fill:var(--t1)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--t3);stroke-width:1}
.cA{stroke:var(--a);fill:var(--a)} .cB{stroke:var(--b);fill:var(--b)} .cN{stroke:var(--t2);fill:var(--t2)}
.lA{stroke:var(--a);fill:none} .lB{stroke:var(--b);fill:none} .lN{stroke:var(--t2);fill:none}
.hA{stroke:var(--a);fill:var(--surface)} .hB{stroke:var(--b);fill:var(--surface)} .hN{stroke:var(--t2);fill:var(--surface)}
.ring{stroke:var(--surface)} .band{fill:var(--rausch);opacity:0.16}
</style>
<rect class="bg" width="780" height="480" rx="6"/>
<text x="16.0" y="28.0" text-anchor="start" class="t1" font-size="16" font-weight="600">Nutzen gegen Rechenzeit: Änderung der WER und Faktor auf die Trainingsdauer</text>
