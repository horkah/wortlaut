<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-label="Anteil ausgefranster Einheiten">
<style>
svg{--surface:#fcfcfb;--t1:#0b0b0b;--t2:#52514e;--t3:#8a8984;--grid:#e6e5e0;--s:#2a78d6;--m:#eb6834;--band:#2a78d6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){svg{--surface:#1a1a19;--t1:#ffffff;--t2:#c3c2b7;--t3:#8f8e87;--grid:#3a3a37;--s:#3987e5;--m:#d95926;--band:#3987e5}}
.bg{fill:var(--surface)} .t1{fill:var(--t1)} .t2{fill:var(--t2)} .t3{fill:var(--t3)}
.grid{stroke:var(--grid);stroke-width:1} .axis{stroke:var(--t3);stroke-width:1}
.cS{stroke:var(--s);fill:var(--s)} .cM{stroke:var(--m);fill:var(--m)} .cB{stroke:var(--t2);fill:var(--surface)}
.ring{stroke:var(--surface)}
</style>
