# Feintuning mit LoRA: das Grundmodell bleibt, gelernt wird ein kleiner Zusatz.
#
# Statt aller 244 Millionen Gewichte werden zwei kleine Matrizen je
# Aufmerksamkeitsschicht trainiert - ein knappes Prozent davon. Das hat drei
# Folgen, und alle drei sind hier der Grund für die Wahl: Es passt bequem in
# den Speicher, es geht schneller, und es kann das Grundmodell nicht verderben,
# weil es es nicht anfasst.
name: Feintuning (LoRA)

# Hundertmal so groß wie beim vollen Training, und das ist kein Tippfehler: Die
# Zusatzmatrizen starten bei null und müssen erst etwas werden. Mit 1e-5 bliebe
# nach acht Durchgängen fast das Grundmodell stehen.
lernrate: 1.0e-3
warmlauf_schritte: 50

# Mehr Durchgänge als beim vollen Training: Es wird weniger gelernt, also
# dauert es länger, bis es gelernt ist - und die Gefahr, dabei etwas kaputt zu
# machen, ist kleiner. Auch das ist eine Obergrenze; ausgeliefert wird der
# beste Durchgang, nicht der letzte (siehe `whisper_full.yaml`).
epochen: 12

stapel: 8
akkumulation: 1

gewichtsverfall: 0.0
fp16: true
gradientenbegrenzung: 1.0

lora:
  # Der Rang der Zusatzmatrizen - wie viel Freiheit der Zusatz bekommt. 32 ist
  # für eine einzelne Stimme reichlich; kleiner lernt zu wenig, größer nähert
  # sich dem vollen Training samt seinen Nachteilen.
  rang: 32
  alpha: 64
  ausfall: 0.05
  # Nur die Projektionen der Aufmerksamkeit. Sie entscheiden, worauf das Modell
  # hört; dort sitzt die Anpassung an eine abweichende Aussprache.
  ziele: [q_proj, v_proj]

# Der Abschluss - was am Ende mit den Gewichten geschieht. Gerechnet wird nur,
# was der Auftrag bestellt (`bester`, `mittel`, `interpoliert`, `beides`); hier
# stehen die Zahlen dazu.
abschluss:
  # Wie viele der besten Zwischenstände gemittelt werden. Drei ist die untere
  # Kante dessen, was als „Model Soup" beschrieben ist; mehr kostet hier nur
  # Platz auf der Platte, denn ein LoRA-Zwischenstand wiegt wenige Megabyte.
  staende: 3
  # Welche Anteile des Grundmodells versucht werden (WiSE-FT). Gewählt wird auf
  # der Validierung, und die Null gehört dazu: Mit ihr kann die Interpolation
  # nicht verlieren - im schlechtesten Fall bleibt der feingetunte Stand.
  #
  # Bei LoRA ist das eine Multiplikation am Zusatz und kostet nichts; das
  # Raster darf deshalb feiner sein als beim vollen Training.
  alphas: [0.0, 0.05, 0.1, 0.2, 0.3, 0.5]

# Die Augmentierung während des Trainings. Welche Stufe gilt, bestellt der
# Auftrag (`keine`, `masken`, `umgebung`, `voll`); hier stehen ihre Zahlen.
# Gerechnet wird beim Laden jeder Probe und nichts davon abgelegt - was
# gewürfelt ist, soll in jedem Durchgang ein anderes sein
# (`training/klangwandel.py`).
augmentierung:
  # SpecAugment, die kleine Einstellung aus der Literatur. Bei wenigen hundert
  # kurzen Sätzen verdeckt die große Einstellung den Satz selbst.
  zeitmasken: 2
  zeitmaske_anteil: 0.12
  frequenzmasken: 2
  frequenzmaske_baender: 16
  # Nachhall, wie ihn ein Wohnzimmer und ein gefliester Flur haben. Darüber
  # klingt es nach Kirche, und dort diktiert niemand.
  raum_wahrscheinlichkeit: 0.5
  raum_nachhall_s: [0.05, 0.35]
  # Von „kaum zu hören" bis „stört deutlich". Die gemessene Fassung `rauschen`
  # liegt mit ihren festen 20 dB mitten darin - hier ist der Abstand jedes Mal
  # ein anderer, damit das Modell keinen bestimmten auswendig lernt.
  rausch_wahrscheinlichkeit: 0.5
  rausch_abstand_db: [10.0, 35.0]
  # Nur in der Stufe `voll`. Bei dysarthrischer Sprache ist das Sprechtempo
  # ein Merkmal des Sprechers - es zu verwürfeln kann helfen oder schaden.
  tempo_wahrscheinlichkeit: 0.5
  tempo_faktor: [0.9, 1.1]
