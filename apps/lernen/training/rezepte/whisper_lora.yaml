# Feintuning mit LoRA: das Grundmodell bleibt, gelernt wird ein kleiner Zusatz.
#
# Zwei kleine Matrizen je Aufmerksamkeitsschicht, ein knappes Prozent der
# Gewichte: passt in den Speicher, geht schneller, verdirbt das Grundmodell nicht.
name: Feintuning (LoRA)

# Hundertmal so groß wie beim vollen Training: Die Zusatzmatrizen starten bei null.
lernrate: 1.0e-3
warmlauf_schritte: 50

# Mehr als beim vollen Training, weil weniger je Durchgang gelernt wird.
# Ebenfalls eine Obergrenze (`whisper_full.yaml`).
epochen: 12

stapel: 8
akkumulation: 1

gewichtsverfall: 0.0
fp16: true
gradientenbegrenzung: 1.0

lora:
  # Für eine Stimme reichlich; größer nähert sich dem vollen Training.
  rang: 32
  alpha: 64
  ausfall: 0.05
  # Dort sitzt die Anpassung an eine abweichende Aussprache.
  ziele: [q_proj, v_proj]

# Die Zahlen zum Abschluss, den der Auftrag bestellt.
abschluss:
  # Wie viele der besten Zwischenstände gemittelt werden (Model Soup).
  staende: 3
  # Die Anteile des Grundmodells (WiSE-FT), gewählt auf der Validierung. Mit
  # der Null kann die Interpolation nicht verlieren.
  # Bei LoRA nur eine Multiplikation am Zusatz, daher feiner.
  alphas: [0.0, 0.05, 0.1, 0.2, 0.3, 0.5]

# Für `geduldig` (sonst `epochen`). Weit, weil der beste Durchgang ausgeliefert wird.
epochen_hoechstens: 60
# Prüfungen ohne Verbesserung bis Schluss - bei kleiner Validierung streut der Verlust.
geduld: 5
# Was als Verbesserung zählt.
mindestgewinn: 0.001

# Die Zahlen zur Augmentierungsstufe des Auftrags - je Probe und Durchgang
# neu gewürfelt, nichts abgelegt (`training/klangwandel.py`).
augmentierung:
  # SpecAugment, die kleine Einstellung - die große verdeckt kurze Sätze ganz.
  zeitmasken: 2
  zeitmaske_anteil: 0.12
  frequenzmasken: 2
  frequenzmaske_baender: 16
  # Nachhall von Wohnzimmer bis gefliestem Flur.
  raum_wahrscheinlichkeit: 0.5
  raum_nachhall_s: [0.05, 0.35]
  # Von „kaum zu hören" bis „stört deutlich"; die gemessene Fassung `rauschen`
  # (fest 20 dB) liegt darin.
  rausch_wahrscheinlichkeit: 0.5
  rausch_abstand_db: [10.0, 35.0]
  # Nur in `voll`. Bei dysarthrischer Sprache ist das Tempo ein Merkmal des
  # Sprechers - es zu verwürfeln kann helfen oder schaden.
  tempo_wahrscheinlichkeit: 0.5
  tempo_faktor: [0.9, 1.1]

# Abweichungen je Grundmodell - nur des Speichers wegen.
je_grundmodell:
  medium:
    # 769 statt 244 Millionen Gewichte; eng wird es durch die Aktivierungen.
    # Sie werden beim Rückwärtsgang neu gerechnet statt aufgehoben: gemessen
    # 2,3 statt 9,3 GB bei Stapel 8 - genug Platz, damit danach der Erkenner
    # auf dieselbe Karte passt - und sogar schneller (68 statt 125 ms je
    # Probe), weil ein volles Gedächtnis mehr kostet als die zweite Rechnung.
    gradientensparsam: true
