# Betrieb: ein Container für die ganze App, davor caddy-docker-proxy des
# Wirts (Compose-Projekt „caddy", eigenes Docker-Netz „caddy").
#
# Darin ein uvicorn für alle drei Apps - „hören" auf der Wurzel, „lernen" unter
# /lernen, „schreiben" unter /schreiben (siehe apps/gesamt.py). Der Proxy
# braucht deshalb nur eine Regel auf diesen einen Port und schneidet nichts ab;
# die Pfade bringen die Apps selbst mit.
#
# Daneben steht ein zweiter Dienst, der nicht von selbst startet: `training`.
# Er rechnet die Feintunings auf der Karte und hängt an keinem Netzweg, sondern
# am geteilten Datenverzeichnis (siehe apps/lernen/training/). Gestartet wird
# er ausdrücklich:
#
#     docker compose --profile training up -d training
#
# Wer die Apps getrennt betreiben will, nimmt statt dessen die beiden
# Dockerfiles unter apps/ als je einen Dienst (docs/betrieb.md).

# ── Was in die Container-Logs darf ──────────────────────────────────────────
#
# Ohne diese vier Zeilen schreibt Docker `json-file` ohne Obergrenze, und das
# ist keine graue Theorie: Der Läufer schreibt jede Zeile eines Trainings
# zweimal - einmal in `protokoll.txt` im Datenverzeichnis, wo die Oberfläche
# sie zeigt, und einmal auf die eigene Ausgabe, wo Docker sie einsammelt
# (`apps/lernen/training/laeufer.py`). Dazu die Fortschrittsbalken von
# transformers, die über stderr mitkommen. So ist ein Log auf 6,2 GB gewachsen
# und hat die Platte des Wirts gefüllt - was mitten in einem Training den
# Prozess erschlug und dessen Arbeitsstand liegen ließ. Beide Hälften dieses
# Schadens sind mit diesem Stand behoben; die andere in `wortlaut/laeufe.py`.
#
# Dreimal zehn Megabyte je Dienst genügen, weil das Log hier nirgends die
# einzige Quelle ist: Wer einen Trainingsfehler sucht, findet ihn im Protokoll
# des Laufs, das vollständig im Volume liegt und von dieser Grenze nichts weiß.
# Übrig bleibt, was der Läufer selbst sagt - ein paar Zeilen je Auftrag.
#
# Wirksam wird die Grenze erst mit einem **neu erstellten** Container
# (`docker compose up -d`); ein Neustart allein genügt nicht, und eine schon
# gewachsene Datei räumt sie nicht weg. Die schneidet einmalig
# `truncate -s 0` auf dem Wirt ab - nicht `rm`, denn den offenen Dateizeiger
# behält Docker, und der Platz käme nicht zurück.
x-logs: &logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# ── Die Pfade des Wirts entstehen nicht von selbst ──────────────────────────
#
# Drei Ablagen liegen nicht im Volume, sondern in einem Pfad des Wirts: die
# Grundmodelle, Ollamas Modelle und alles, was ein Training hervorbringt
# (warum, steht an den Mounts selbst).
#
# Docker legt eine fehlende Bind-Quelle stillschweigend an. Fehlt der Pfad -
# etwa weil die Platte nicht eingehängt ist -, entsteht das Verzeichnis
# anderswo, und zwanzig Gigabyte landen still auf der falschen Platte.
# `create_host_path: false` macht daraus einen Fehlschlag beim Start: Der
# Container läuft nicht an und nennt den Pfad, der fehlt. Der Preis ist ein
# `mkdir -p` beim Aufsetzen, siehe docs/betrieb.md.
x-wirtspfad: &wirtspfad
  type: bind
  bind:
    create_host_path: false

services:
  wortlaut:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logs
    env_file: .env
    depends_on:
      - ollama
    networks:
      # „caddy" bringt die Anfragen von draußen; „intern" führt allein zu
      # Ollama und ist von außen nicht erreichbar.
      - caddy
      - intern
    labels:
      # caddy-docker-proxy liest das vom Docker-Socket und baut daraus die
      # Route - keine Zeile in der Caddyfile des Wirts nötig. Der Port ist
      # der Port des Containers selbst, nicht der des Wirts.
      caddy: wortlaut.bitzz.de
      caddy.reverse_proxy: "{{upstreams 8000}}"
    environment:
      # Im Container liegen die Daten immer hier; auf dem Wirt entscheidet das
      # Volume unten, wo das tatsächlich ist.
      WORTLAUT_DATA_DIR: /srv/wortlaut/data
      # Der Weg von „schreiben" zurück in den Korpus führt auch hier über die
      # API und nicht am Modell vorbei (Grundentscheidung 6) - nur zeigt er
      # jetzt auf denselben Prozess.
      #
      # Einen Token braucht es hier nicht: „schreiben" sendet mit dem Zugang
      # des Sprechers, der den Text gerade bestätigt hat. Damit liegt kein
      # Geheimnis in dieser Datei, und die Korrektur geht zwingend in den
      # Korpus dessen, der sie abgenickt hat.
      WORTLAUT_INTAKE_URL: http://127.0.0.1:8000/api/korpus/intake
    volumes:
      - wortlaut-data:/srv/wortlaut/data
      # Die Grundmodelle von Hugging Face - sechs Gigabyte, die jederzeit neu
      # zu holen sind. Deshalb kein Volume neben den Daten, sondern ein Pfad
      # auf dem Wirt: WORTLAUT_MODELLCACHE in der .env zeigt auf die große,
      # langsame Platte, während Aufnahmen und Datenbanken auf der SSD
      # bleiben. Das Laden beim ersten Start dauert dadurch etwas länger;
      # gerechnet wird danach ohnehin auf der Karte.
      - <<: *wirtspfad
        source: ${WORTLAUT_MODELLCACHE:-./data/modellcache}
        target: /srv/wortlaut/modellcache
      # Was ein Training hervorbringt, liegt ebenfalls nicht im Volume der
      # Daten: die Modellstände (`modelle/`, hier knapp ein Gigabyte je Stand)
      # und die Laufverzeichnisse (`snapshots/`) mit Auftrag, Manifest,
      # Protokoll und Bewertung. Beides ist aus dem Korpus jederzeit neu zu
      # rechnen - es kostet eine Stunde auf der Karte, aber keine Aufnahme -,
      # und die Sicherung nimmt es aus genau diesem Grund schon heute nicht
      # mit (`wortlaut/sicherung.py`). Im Container bleiben die Pfade, wo der
      # Quelltext sie erwartet: unter WORTLAUT_DATA_DIR. Auf dem Wirt zeigt
      # WORTLAUT_TRAININGSABLAGE dorthin, wo Platz ist.
      - <<: *wirtspfad
        source: ${WORTLAUT_TRAININGSABLAGE:-./data/training}/modelle
        target: /srv/wortlaut/data/modelle
      - <<: *wirtspfad
        source: ${WORTLAUT_TRAININGSABLAGE:-./data/training}/snapshots
        target: /srv/wortlaut/data/snapshots
    # Die Karte, wenn eine da ist. Diktieren und die Auswertung nehmen sie
    # (`wortlaut/rechenwerk.py`) - das ist der Unterschied zwischen vier
    # Sekunden und einer Viertelsekunde je Aufnahme.
    #
    # Geteilt mit `training` und `ollama`, und das ist Absicht: Es ist eine
    # Karte, und wer sie zuerst braucht, bekommt sie. Reicht der Speicher
    # nicht - ein Training will acht Gigabyte, das Sprachmodell weitere sechs -,
    # weicht die Erkennung hier auf den Prozessor aus, statt das Diktat
    # scheitern zu lassen. Sie schreibt dann mit, dass sie es getan hat, damit
    # die Rechenzeit danach nicht wie ein schlechteres Modell aussieht.
    #
    # Wer keine Karte hat, lässt den Block weg oder startet mit
    # `docker compose up` auf einem Wirt ohne nvidia-Laufzeit - der Dienst
    # startet auch dann, nur eben auf dem Prozessor.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # Ohne Token erreichbar und ohne curl im Abbild auskommend.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/gesundheit')"]
      interval: 30s
      timeout: 5s
      # Der erste Start lädt das Whisper-Modell; bis dahin ist „ungesund" kein
      # Grund, den Container umzubringen.
      start_period: 5m
      retries: 3

  # Der Trainer. Er beantwortet keine Anfrage und hängt an keinem Netz: Alles,
  # was er braucht, steht im Datenverzeichnis, und alles, was er hervorbringt,
  # legt er dort wieder ab (`data/snapshots/` und `data/modelle/` - zwei Pfade,
  # die auf dem Wirt nicht im Volume liegen, siehe unten). Deshalb teilt er
  # sich mit `wortlaut` nur die Ablage - und deshalb kann jeder von beiden neu
  # starten, ohne den anderen mitzunehmen.
  #
  # `profiles` hält ihn aus dem gewöhnlichen `docker compose up` heraus: Das
  # Abbild wiegt einige Gigabyte und verlangt eine Karte. Wer beides hat,
  # startet ihn mit `--profile training`; wer nicht, merkt nichts von ihm - die
  # Oberfläche von „lernen" steht trotzdem, Aufträge sammeln sich in der
  # Warteschlange, und keiner geht verloren.
  training:
    build:
      context: .
      dockerfile: apps/lernen/training/Dockerfile
    profiles: [training]
    restart: unless-stopped
    logging: *logs
    env_file: .env
    # Kein `networks`: Dieser Dienst ruft nichts und wird von nichts gerufen.
    # Er lädt einmal das Grundmodell von Hugging Face - das geht über das
    # Standardnetz von Compose.
    environment:
      WORTLAUT_DATA_DIR: /srv/wortlaut/data
    volumes:
      # Dasselbe Volume wie `wortlaut`, und zwar beschreibbar: Hier entstehen
      # die Modellstände. Der Korpus daneben wird nur gelesen - dass „hören"
      # sein einziger Schreiber ist (Grundentscheidung 6), hält der Quelltext
      # ein, nicht das Dateisystem.
      - wortlaut-data:/srv/wortlaut/data
      # Dieselben Grundmodelle wie „hören" - ein Feintuning setzt auf einem
      # von ihnen auf, und zweimal sechs Gigabyte wären zweimal zu viel.
      - <<: *wirtspfad
        source: ${WORTLAUT_MODELLCACHE:-./data/modellcache}
        target: /srv/wortlaut/modellcache
      # Was ein Training hervorbringt, liegt ebenfalls nicht im Volume der
      # Daten: die Modellstände (`modelle/`, hier knapp ein Gigabyte je Stand)
      # und die Laufverzeichnisse (`snapshots/`) mit Auftrag, Manifest,
      # Protokoll und Bewertung. Beides ist aus dem Korpus jederzeit neu zu
      # rechnen - es kostet eine Stunde auf der Karte, aber keine Aufnahme -,
      # und die Sicherung nimmt es aus genau diesem Grund schon heute nicht
      # mit (`wortlaut/sicherung.py`). Im Container bleiben die Pfade, wo der
      # Quelltext sie erwartet: unter WORTLAUT_DATA_DIR. Auf dem Wirt zeigt
      # WORTLAUT_TRAININGSABLAGE dorthin, wo Platz ist.
      - <<: *wirtspfad
        source: ${WORTLAUT_TRAININGSABLAGE:-./data/training}/modelle
        target: /srv/wortlaut/data/modelle
      - <<: *wirtspfad
        source: ${WORTLAUT_TRAININGSABLAGE:-./data/training}/snapshots
        target: /srv/wortlaut/data/snapshots
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Lokale Textquelle statt eines bezahlten Anbieters: Ollama auf der Karte des
  # Wirts. Nichts verlässt die Maschine, und es kostet keinen Token. „hören"
  # spricht es über die OpenAI-kompatible Schnittstelle an (WORTLAUT_LLM_*
  # in der .env). Aus dem Netz ist es nicht erreichbar - kein „ports", nur das
  # interne Netz.
  #
  # Es ist dieselbe Karte, auf der die Erkennung und das Training rechnen.
  # Ollama legt das Modell vollständig darauf (`ollama ps` sagt „100% GPU"),
  # solange der Speicher reicht, und weicht sonst teilweise auf den Prozessor
  # aus - dann dauert die Texterzeugung länger, scheitert aber nicht.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    logging: *logs
    networks:
      - intern
    environment:
      # Wie lange das Sprachmodell nach einer Anfrage auf der Karte liegen
      # bleibt. Ollamas Vorgabe sind fünf Minuten; wer danach eine zweite
      # Textquelle anlegt, wartet erneut die knapp sechs Sekunden, die das
      # Laden von sechs Gigabyte dauert.
      #
      # Länger ist nicht umsonst: Solange es liegt, belegt es diese Gigabyte,
      # und es ist dieselbe Karte, auf der trainiert wird. Nachgemessen sind es
      # bei `gemma2:9b` 5,4 GB von 10,75 nutzbaren - der mit Abstand größte
      # einzelne Posten auf dieser Karte.
      #
      # Eine Viertelstunde stand hier lange als Ausgleich. Sie war zu lang: Wer
      # eine Textquelle anlegt und danach ein Training startet, hat die 5,4 GB
      # noch volle vierzehn Minuten gegen sich, und der Trainer ist der
      # einzige, der daran scheitert statt langsamer zu werden
      # (`training/bewerten.py`). Eine Minute deckt weiterhin den Fall ab, für
      # den das gedacht war - mehrere Textquellen hintereinander -, und gibt
      # die Karte danach frei. Über die .env zu ändern.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-1m}
    volumes:
      # Die geladenen Modelle überleben hier einen Neustart - und sie liegen
      # aus demselben Grund neben den Whisper-Modellen und nicht im Volume:
      # fünf Gigabyte, die ein `ollama pull` jederzeit wiederholt. Was Ollama
      # sonst noch hier ablegt, ist sein Schlüsselpaar; auch das ist neu zu
      # erzeugen und keine Sicherung wert. Wohin auf dem Wirt, sagt
      # WORTLAUT_OLLAMACACHE in der .env.
      - <<: *wirtspfad
        source: ${WORTLAUT_OLLAMACACHE:-./data/ollama}
        target: /root/.ollama
    healthcheck:
      # Ohne curl im Abbild: `ollama list` spricht dieselbe Schnittstelle an,
      # die auch „hören" benutzt, und antwortet erst, wenn der Dienst steht.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 1m
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  caddy:
    external: true
  intern: {}

volumes:
  # Nur noch eines, und das ist die Absicht: Was hier steht, ist das
  # Unersetzliche - die Aufnahmen, die Datenbanken, der Arbeitsstand von
  # „schreiben". Alles, was sich daraus oder aus dem Netz wiederherstellen
  # lässt, liegt in einem Pfad des Wirts (WORTLAUT_MODELLCACHE,
  # WORTLAUT_OLLAMACACHE, WORTLAUT_TRAININGSABLAGE) und nicht hier.
  wortlaut-data:
