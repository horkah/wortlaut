# Betrieb: ein Anwendungscontainer je App, davor der Reverse Proxy des Wirts.
# Er besorgt TLS und verteilt die Pfade einer Domain auf die Ports hier — die
# Wege bleiben dabei unverändert, jede App hängt schon selbst unter ihrem Pfad
# (siehe docs/betrieb.md). Gebunden wird nur an 127.0.0.1: aus dem Netz
# erreichbar ist ausschließlich der Proxy.
# „lernen" kommt als weiterer Dienst nach demselben Muster dazu.
services:
  hoeren:
    build:
      context: .
      dockerfile: apps/hoeren/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # Im Container liegen die Daten immer hier; auf dem Wirt entscheidet das
      # Volume unten, wo das tatsächlich ist.
      WORTLAUT_DATA_DIR: /srv/wortlaut/data
    volumes:
      - wortlaut-data:/srv/wortlaut/data
    ports:
      - "127.0.0.1:8000:8000"

  schreiben:
    build:
      context: .
      dockerfile: apps/schreiben/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      WORTLAUT_DATA_DIR: /srv/wortlaut/data
      # Zwei Container, ein Volume: „schreiben" schreibt nur in sein eigenes
      # Verzeichnis (data/diktate) und liest die Modelle aus data/modelle.
      # Der Korpus gehört „hören" allein (Grundentscheidung 6); dorthin geht
      # es über die API, nicht über das Dateisystem.
      WORTLAUT_INTAKE_URL: http://hoeren:8000/api/korpus/intake
      WORTLAUT_INTAKE_TOKEN: ${WORTLAUT_AUTH_TOKEN:-}
    volumes:
      - wortlaut-data:/srv/wortlaut/data
    ports:
      # Eigener Port, denn der Proxy spricht beide Dienste an: die Wurzel geht
      # an „hören" (8000), `/schreiben/` hierher.
      - "127.0.0.1:8001:8000"
    depends_on:
      - hoeren

volumes:
  wortlaut-data:
