[project]
name = "wortlaut"
version = "0.1.0"
description = "Personalisierte Spracherkennung für Deutsch"
requires-python = ">=3.12"
license = { file = "LICENSE" }

# Eine Abhängigkeitsliste für das ganze Repository. Bei drei kleinen Apps, die
# dieselbe Bibliothek nutzen, ist ein Satz Abhängigkeiten übersichtlicher als
# drei, die auseinanderlaufen.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "anthropic>=0.40",          # Textquelle „LLM"
    "pypdf>=5.0",               # einziges Textformat ohne Standardbibliothek
    "httpx>=0.27",              # „schreiben": Postausgang und entfernte ASR
]

# faster-whisper zieht CTranslate2 und Modelldateien nach und wird im Betrieb
# von „schreiben" (Diktat) und „hören" (Auswertung) gebraucht - für Tests wäre
# das unnötiger Ballast. Installiert mit:
#     uv sync --extra asr
#
# `gpu` legt die CUDA-Bibliotheken daneben, die CTranslate2 braucht, um eine
# Karte zu benutzen: cuBLAS und cuDNN, als Räder von PyPI statt als Systempaket.
# Sie sind ein eigenes Extra und keine feste Abhängigkeit, denn sie wiegen gut
# zwei Gigabyte, und ein Wirt ohne Karte hat nichts davon - dort fällt die
# Erkennung ohnehin auf den Prozessor zurück (`wortlaut/rechenwerk.py`).
#
# Torch steht hier weiterhin **nicht**: Das braucht nur das Training, und das
# läuft in einem eigenen Abbild (`apps/lernen/training/Dockerfile`).
#     uv sync --extra asr --extra gpu
[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
# Vorlesen auf dem Server (`wortlaut/vorlesen.py`). Piper rechnet auf dem
# Prozessor und braucht keine Karte; die Stimmen selbst liegen nicht hier,
# sondern im Modellspeicher (`scripts/vorlesen.py`).
#
# Ein eigenes Extra, weil es ohne geht: Fehlt Piper, liest der Browser vor wie
# bisher. Eine feste Abhängigkeit wäre ein Paket mehr in jeder Installation,
# die diese Hilfe nie benutzt.
vorlesen = ["piper-tts>=1.3"]
gpu = [
    # Die Fassungen sind an CTranslate2 4.5+ gebunden: Es verlangt cuDNN 9 und
    # CUDA 12. Eine ältere cuDNN lädt, meldet aber beim ersten Erkennen einen
    # fehlenden Symbolnamen - ein Fehler, der erst zur Laufzeit auftritt.
    "nvidia-cublas-cu12>=12.3",
    "nvidia-cudnn-cu12>=9.0,<10",
]

# Nur für Entwicklung und Tests, nicht im Betrieb.
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx2>=2.10",  # von starlette.testclient bevorzugt, sonst Deprecation-Warnung
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Die geteilte Bibliothek liegt unter packages/, wird aber als Teil dieses
# Projekts installiert (editierbar, d. h. Änderungen wirken sofort).
[tool.hatch.build.targets.wheel]
packages = ["packages/wortlaut/src/wortlaut"]

[tool.pytest.ini_options]
testpaths = [
    "packages/wortlaut/tests",
    "apps/hoeren/tests",
    "apps/lernen/tests",
    "apps/schreiben/tests",
    "tests",
]
# Die Apps sind keine installierten Pakete, sondern werden aus dem
# Wurzelverzeichnis importiert - wie beim Start über uvicorn.
pythonpath = ["."]
addopts = "-q"
